# Tool configuration (the workflow itself is run with Snakemake, see README.md)

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W6"]
ignore = ["E741"]  # short symbols (l, I) follow the notation of the model description

[tool.snakefmt]
line_length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
