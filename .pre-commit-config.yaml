# pre-commit install   (hooks run on every commit; all files: pre-commit run --all-files)
exclude: ^(docs/img/|workflow/repo_data/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2000"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: ["--fix"]
  - repo: https://github.com/snakemake/snakefmt
    rev: v2.1.0
    hooks:
      - id: snakefmt
