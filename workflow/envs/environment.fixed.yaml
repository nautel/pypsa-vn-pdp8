name: pypsa-vn-pdp8-fixed
# exact versions of the direct dependencies in the environment that solved the archived run set (results_v6);
# environment.yaml pins only the main packages
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.13.16
  - pypsa=1.2.4
  - linopy=0.8.0
  - highspy=1.15.1
  - pandas=2.3.3
  - numpy=2.5.3
  - xarray=2026.9.0
  - dask=2026.8.0
  - netcdf4=1.7.4
  - pytables=3.11.1
  - scipy=1.18.1
  - scikit-learn=1.9.1
  - networkx=3.7
  - geopandas=1.2.0
  - pyogrio=0.13.0
  - shapely=2.2.0
  - pyproj=3.8.0
  - rasterio=1.5.2
  - rioxarray=0.23.0
  - atlite=0.4.1
  - matplotlib=3.11.2
  - openpyxl=3.1.5
  - pyyaml=6.0.3
  - requests=2.34.2
  - cdsapi=0.7.7
  - snakemake-minimal=9.27.0
  - pip=26.2.1
  - pip:
      - gurobipy==13.0.3  # optional; requires a Gurobi licence
